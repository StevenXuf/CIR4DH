extractor_name: openclip
batch_size: 64
num_workers: 4
gpu_id: 0

seed: 42
top_ks: [1, 5, 10, 50]

remove_duplicates: true # bool, remove duplicates in the dataset based on id1 and id2
use_metadata: false # bool, use capitalized ones in terminal
use_first_hierarchy: false # bool, use first hierarchy for metadata
gen_model: "qwen" # str, model to use for text generation, choices: [qwen, llava, deepseek]
baseline: gen

dataset_name: "glam"
paths:
  glam_root: /data/data_fxu/GLAM/raw
  cir_file: cir_db.csv
  db_processed_name: db_processed.txt
  log_path: logs/
  figure_path: figures/

split: test_ood

image_gallery: 
  - test_id
  - test_ood
  - train
  - val

fields:
  - materials_1
  - ObjectTypes_1
  - materials_2
  - ObjectTypes_2

qwen:
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  top_p: 0.9
  top_k: 50
  temperature: 0.1
  max_new_tokens: 128

deepseek:
  model_id: "deepseek-ai/deepseek-vl-7b-chat"

llava:
  model_id: "llava-hf/llava-v1.6-mistral-7b-hf"