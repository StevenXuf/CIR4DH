## global config ##
GENERAL:
    BATCH_SIZE: 8 ## batch size should be lower for CIRR images as they are larger
    NUM_WORKERS: 8
    DEVICE: 1
    SEED: 42
    EXTRACTOR: "OPENCLIP" # options: CLIP, OPENCLIP, SIGLIP2, OPENVISION
    DATASET: "CIRCO"
    TOP_K: [1, 5, 10, 25, 50]
    SPLIT: "val" 
    TASK: "img2img" # options: txt2img, txt2txt
    MODE: "relative" # options: relative, classic
    USE_MLLM: "yes" # whether to use raw caption without any prompt engineering
    IMAGE_GEN_MODEL: "SDXL-INSTRUCTPIX2PIX" # options: SDXL-INSTRUCTPIX2PIX, SDXL-TURBO
    MLLM: "QWEN-7B" # options: QWEN-7B, QWEN-3B, DEEPSEEK, LLAVA

## datset information ##
RefinedFashionIQ:
    IMAGE_URL_FOLDER: 'RefinedFashionIQ/image_url'
    IMAGE_SIZE: 224
    IMAGE_FOLDER: 'RefinedFashionIQ/images'
    CAPTION_FOLDER: 'RefinedFashionIQ/captions'
    SPLIT: 'val' # test set is not available

FashionIQ:
    IMAGE_FOLDER: 'RefinedFashionIQ' #shared same images with refined-fashioniq
    IMAGE_SIZE: 224
    SPLIT: 'val' # test set is not usable!

CIRCO:
    IMAGE_FOLDER: 'CIRCO'
    IMAGE_SIZE: 224
    SPLIT: 'val'

CIRR:
    IMAGE_FOLDER: 'CIRR'
    IMAGE_SIZE: 224
    SPLIT: 'val' # alternative train, test1

GeneCIS:
    VG_FOLDER: 'GeneCIS/VG_100K'
    COCO_FOLDER: 'COCO/images/val2017'
    GENECIS_ROOT: 'GeneCIS/genecis/genecis'                       # Path to GeneCIS templates (/project/dir/genecis)
    SPLIT: 'test'
    IMAGE_SIZE: 224

## feature extractor config ##
CLIP:
    MODEL_NAME: "openai/clip-vit-base-patch32"
    PRETRAINED: None
    IMAGE_SIZE: 224
    IMAGE_MEAN: [0.48145466, 0.4578275, 0.40821073]
    IMAGE_STD: [0.26862954, 0.26130258, 0.27577711]

OPENCLIP:
    MODEL_NAME: "ViT-B-32"
    PRETRAINED: "laion2b_s34b_b79k"
    IMAGE_SIZE: 224
    IMAGE_MEAN: [0.48145466, 0.4578275, 0.40821073]
    IMAGE_STD: [0.26862954, 0.26130258, 0.27577711]

BLIP2:
    MODEL_NAME: "Salesforce/blip2-itm-vit-g"
    IMAGE_SIZE: 224
    IMAGE_MEAN: [0.48145466, 0.4578275, 0.40821073]
    IMAGE_STD: [0.26862954, 0.26130258, 0.27577711]

BLIP2-OFFICIAL:
    MODEL_NAME: "blip2_feature_extractor"
    IMAGE_SIZE: 224
    IMAGE_MEAN: [0.48145466, 0.4578275, 0.40821073]
    IMAGE_STD: [0.26862954, 0.26130258, 0.27577711] 

SIGLIP2:
    MODEL_NAME: "google/siglip2-base-patch16-224"
    PRETRAINED: None
    IMAGE_SIZE: 224
    IMAGE_MEAN: [0.5, 0.5, 0.5]
    IMAGE_STD: [0.5, 0.5, 0.5]

OPENVISION:
    MODEL_NAME: "UCSC-VLAA/openvision-vit-base-patch16-224"
    PRETRAINED: None
    IMAGE_SIZE: 224
    IMAGE_MEAN: [0.485, 0.456, 0.406]
    IMAGE_STD: [0.229, 0.224, 0.225]

## image generation config ##
IMAGE-GENERATION:
    SDXL-INSTRUCTPIX2PIX:
        MODEL_NAME: "diffusers/sdxl-instructpix2pix-768"
        NUM_INFERENCE_STEPS: 30
        IMAGE_GUIDANCE_SCALE: 3.0
        GUIDANCE_SCALE: 7.5
        IMAGE_SIZE: 768
        OUTPUT_DIR: 'sdxl_instructpix2pix_output'
    SDXL-TURBO: # much faster than SDXL-INSTRUCTPIX2PIX
        MODEL_NAME: "stabilityai/sdxl-turbo"
        NUM_INFERENCE_STEPS: 60
        IMAGE_GUIDANCE_SCALE: 0.5
        GUIDANCE_SCALE: 0.0
        IMAGE_SIZE: 512
        OUTPUT_DIR: 'sdxl_turbo_output'

## text generation config ##
TEXT-GENERATION:
    GLOBAL:
        MAX_NEW_TOKENS: 128
        TEMPERATURE: 0.1
        TOP_P: 0.9
        TOP_K: 50
    QWEN-7B:
        MODEL_NAME: "Qwen/Qwen2.5-VL-7B-Instruct"
    QWEN-3B:
        MODEL_NAME: "Qwen/Qwen2.5-VL-3B-Instruct"
    LLAVA:
        MODEL_NAME: "llava-hf/llava-1.5-7b-hf"
    DEEPSEEK:
        MODEL_NAME: "deepseek-community/deepseek-vl-1.3b-chat"